<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Mumbai Interior — admin</title>
<link rel="icon" href="/admin/icon-192.png" type="image/png"/>
<link rel="manifest" href="/admin/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/admin/icon-192.png"/>
<meta name="apple-mobile-web-app-title" content="MI Admin"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link rel="stylesheet" href="assets/doc/doc.css"/>
<script>if(!sessionStorage.getItem('carpenter_admin'))location.replace('/admin/login/'+location.hash);else document.documentElement.classList.add('booting')</script>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="boot" aria-live="polite"><img src="/admin/icon-192.png" alt=""/><span>Opening admin…</span></div>
<div class="app" id="app">
  <aside class="sb" id="sb">
    <div class="brand"><img src="assets/logo.png" alt=""/>Mumbai Interior admin</div>
    <nav class="nav" id="nav" aria-label="Admin sections"></nav>
    <div class="sbfoot"><a class="btn sm" href="/" target="_blank" rel="noopener">View website</a><button class="btn sm" onclick="logout()">Sign out</button><div class="who" id="who"></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu">☰</button>
      <div><h1 id="pTitle">Dashboard</h1><div class="sub" id="pSub"></div></div>
      <div class="acts"><a class="conn" id="conn" href="#publishing"><i></i><span>Not connected</span></a><button class="btn pri" id="pubAll" onclick="publishAll()" hidden>Publish changes</button></div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><p id="mText"></p><div class="bar"><button class="btn" id="mNo">Cancel</button><button class="btn danger" id="mYes">Delete</button></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/html2pdf.bundle.min.js" defer></script>
<script src="assets/doc/doc.js"></script>
<script src="assets/doc/admin-docs.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
