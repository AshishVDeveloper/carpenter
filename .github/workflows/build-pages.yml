name: Rebuild pages
# Regenerates the separate search-friendly pages whenever the admin panel publishes new data.
on:
  push:
    branches: [main]
    paths: ['data/**', 'assets/render.js', 'assets/store.js', 'assets/store.css', 'images/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: rebuild-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock sharp@0.33 terser@5 csso@5 || npm install --no-save --no-package-lock terser@5 csso@5 || true
      - run: node tools/build.mjs
      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild pages from data" && git push && sleep 120 && bash tools/indexnow.sh)
