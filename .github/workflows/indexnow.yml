name: Notify search engines
# Pings IndexNow (Bing, Yandex and others) after the site changes. Free, no account needed.
on:
  push:
    branches: [main]
    paths: ['sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 120   # let GitHub Pages publish first
      - run: bash tools/indexnow.sh
